services:
  - type: web
    name: arkik-preview
    runtime: node
    plan: free
    branch: preview/cloudflare
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: SEED_MODE
        value: "false"
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_OWNER_PIN
        sync: false
      - key: ADMIN_IT_PIN
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
